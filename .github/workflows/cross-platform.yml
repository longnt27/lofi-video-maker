name: Cross-platform checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          $ffmpegDir = Join-Path $env:ChocolateyInstall "bin"
          Add-Content -Path $env:GITHUB_PATH -Value $ffmpegDir
      - name: Verify executables
        run: |
          python --version
          ffmpeg -version
          ffprobe -version
      - name: Install optional test dependencies
        run: python -m pip install -r requirements-watermark.txt
      - name: Run platform-independent smoke tests
        run: python -m unittest discover -s tests -p test_cross_platform.py -v
      - name: Real FFmpeg end-to-end export and cache checks
        run: python -m unittest discover -s tests -p test_end_to_end_platform.py -v
      - name: Layered seamless loop tests (pixels, timing, full export)
        run: python -m unittest discover -s tests -p test_seamless_loop.py -v
      - name: LaMa Fallin streaming, audio and cache checks
        run: python -m unittest discover -s tests -p test_fallin.py -v
      - name: Mocked LaMa worker and quiet logs (all platforms)
        run: python -m unittest discover -s tests -p test_quiet_console.py -v
      - name: CLI help
        run: python lofi_maker.py --help
      - name: Full legacy suite (POSIX only)
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
